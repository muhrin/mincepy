ci:
  skip: [ ty ]

# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [ '--maxkb=5000' ]
      - id: end-of-file-fixer
      - id: check-case-conflict
      - id: detect-private-key
      - id: check-docstring-first
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format
        exclude: (.*)/migrations

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [ "-c", ".bandit.yaml" ]

  - repo: local
    hooks:
      # Type checking.  This needs the project's dependencies to resolve imports, so it uses the
      # active environment (pip install -e .[dev]) and is only run on demand:
      #   pre-commit run --hook-stage manual ty --all-files
      - id: ty
        name: ty
        entry: ty check
        language: system
        stages: [ manual ]
        types_or: [ python, pyi ]
        pass_filenames: false
        require_serial: true

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.2
    hooks:
      - id: commitizen
        stages: [ commit-msg ]

  - repo: https://github.com/srstevenson/nb-clean
    rev: 4.0.1
    hooks:
      - id: nb-clean
