name: continuous-integration

on: [ push, pull_request ]

env:
  DEFAULT_PYTHON: '3.13'

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - uses: pre-commit/action@v3.0.1

  ty:
    name: ty
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

      - name: Install python dependencies
        run: pip install -e .[cli,gui,dev,docs,sci]

      - name: Run ty checks
        # Point ty at the interpreter that has the dependencies installed
        run: ty check --python "$(which python)"

  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.12', '3.13', '3.14' ]

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install python dependencies
        run: pip install -e .[cli,gui,dev,docs,sci]

      - name: Run pytest
        run: pytest --cov=mincepy -sv -p no:nb_regression test

      - name: Create xml coverage
        run: coverage xml

      - name: Upload coverage to Codecov
        if: github.repository == 'muhrin/mincepy'
        uses: codecov/codecov-action@v7.1.1
        with:
          files: ./coverage.xml
          name: mincepy
          token: ${{ secrets.CODECOV_TOKEN }}

  tests-litemongo:
    # The test suite without a MongoDB server, using litemongo's in-memory and SQLite engines
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        engine: [ memory, sqlite ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

      - name: Install python dependencies
        run: pip install -e .[cli,gui,dev,docs,sci]

      - name: Run pytest
        env:
          MINCEPY_TEST_URI: >-
            ${{ matrix.engine == 'memory'
            && 'litemongo://?engine=memory#mincepy-tests'
            || format('litemongo://{0}/litemongo-db#mincepy-tests', runner.temp) }}
        run: pytest -sv -p no:nb_regression --benchmark-skip test
